[project]
name = "shopvacrattrap"
version = "0.0.0"
description = "IoT rodent trap: BOM tooling, ESPHome firmware and OpenSCAD models"
readme = "README.md"
license = "CERN-OHL-P-2.0"
# ESPHome's toolchain (ruamel-yaml-clib, platformio) does not build on 3.14 yet.
requires-python = ">=3.12,<3.14"
# BOM management scripts in .github/scripts/
dependencies = [
  "openpyxl>=3.1.0",
  "pandas>=2.3.0",
  "python-dotenv>=1.0.0",
  "requests>=2.32.0",
  "xlrd>=2.0.1",
]

[dependency-groups]
dev = [
  "detect-secrets>=1.5.0",
  "prek>=0.5.0",
  "pytest>=8.0.0",
  "pytest-mock>=3.12.0",
  "ruff>=0.12.9",
  "yamllint>=1.32.0",
]
# Local firmware builds; CI compiles via esphome/build-action instead.
firmware = [
  "esphome>=2025.10.5",
  "starlette<0.47", # Constrain starlette to be compatible with platformio
]
docs = [
  "mkdocs>=1.5.3,<2.0.0",
  "mkdocs-material>=9.5.0,<10.0.0",
  "mkdocs-git-revision-date-localized-plugin>=1.2.0,<2.0.0",
  "mkdocs-minify-plugin>=0.8.0,<1.0.0",
  "pymdown-extensions>=11.0.1,<12.0.0",
]

[tool.uv]
package = false
default-groups = ["dev"]
# Security floors for transitive deps: keep the lockfile from resolving below
# the versions the Renovate security PRs require. See PRs #60/#79/#80/#81/#82.

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
