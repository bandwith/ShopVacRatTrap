---
# esphome/packages/display-camera.yaml

esphome:
  includes:
    - display_helpers.h

font:
  - file: gfonts://Roboto Mono
    id: font_small
    size: 8
  - file: gfonts://Roboto Mono
    id: font_medium
    size: 12

display:
  - platform: ssd1306_i2c
    model: SSD1306 128x64
    address: 0x3C
    update_interval: 1s
    id: camera_display
    pages:
      - id: main_page
        lambda: |-
          using namespace esphome::rat_trap_display;

          // Shared header + WiFi badge.
          draw_header(it, id(font_small),
                      "Camera Trap ${line_voltage} ${safety_standard}",
                      id(wifi_component).is_connected());

          // Sensor rows (variant-specific: APDS / PIR / ToF / camera).
          it.printf(0, 12, id(font_medium), "4-Sensor Hybrid:");
          it.printf(0, 26, id(font_small),
                    "%s APDS", (id(apds_detection).state ? "✓" : "○"));
          it.printf(40, 26, id(font_small),
                    "%s PIR", (id(pir_detection).state ? "✓" : "○"));
          it.printf(70, 26, id(font_small),
                    "%s ToF", (id(tof_detection).state ? "✓" : "○"));
          it.printf(100, 26, id(font_small), "📷");

          // Shared status band.
          draw_trap_status(it, id(font_small), id(emergency_stop).state,
                           id(trap_triggered).state, id(system_armed).state);

          // Camera-only status line.
          it.printf(0, 48, id(font_small),
                    "CAM:OK IR:%d%%", (int)id(ir_brightness_number).state);

          // Shared footer (environmental temperature source; no warning marker).
          draw_stats_footer(it, id(font_small), id(capture_count).state,
                            id(env_temperature).state, false);
