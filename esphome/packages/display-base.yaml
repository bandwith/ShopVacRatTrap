---
# esphome/packages/display-base.yaml

esphome:
  includes:
    - display_helpers.h

font:
  - file: gfonts://Roboto Mono
    id: font_small
    size: 8
  - file: gfonts://Roboto Mono
    id: font_medium
    size: 12

display:
  - platform: ssd1306_i2c
    i2c_id: bus_a
    model: SSD1306 128x64
    address: 0x3C
    update_interval: 1s
    id: main_display
    pages:
      - id: main_page
        lambda: |-
          using namespace esphome::rat_trap_display;

          // Shared header + WiFi badge.
          draw_header(it, id(font_small),
                      "Trap ${line_voltage} ${safety_standard}",
                      id(wifi_component).is_connected());

          // Sensor rows (variant-specific: IR / ToF / Vib).
          it.printf(0, 12, id(font_medium), "Hybrid Detection:");
          it.printf(0, 26, id(font_small), "IR");
          it.printf(20, 26, id(font_small), "%s",
                    (id(ir_presence).state ? "✓" : "○"));
          it.printf(40, 26, id(font_small), "ToF");
          it.printf(70, 26, id(font_small), "%s",
                    (id(distance_sensor).state < id(detection_threshold).state ? "✓" : "○"));
          it.printf(90, 26, id(font_small), "Vib");
          it.printf(115, 26, id(font_small), "%s",
                    (id(accel_x).state > 5.0 ? "✓" : "○"));

          // Shared status band.
          draw_trap_status(it, id(font_small), id(emergency_stop).state,
                           id(trap_triggered).state, id(system_armed).state);

          // Shared footer (ESP32 die temperature source).
          draw_stats_footer(it, id(font_small), id(capture_count).state,
                            id(esp32_temp).state,
                            id(esp32_temp).has_state() &&
                                id(esp32_temp).state > ${esp32_temp_warning_threshold});
