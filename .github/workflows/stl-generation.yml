---
name: Generate STL Files from SCAD

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 3d_models/**.scad
  workflow_dispatch:
    inputs:
      force_regenerate:
        description: Force regenerate all STL files even if unchanged
        required: false
        default: false
        type: boolean

# Cancel superseded runs on the same branch/PR to conserve Actions minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-stl:
    runs-on: ubuntu-latest
    outputs:
      should_commit: ${{ steps.generate.outputs.should_commit }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Cache apt packages
        uses: actions/cache@v6
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-openscad
          restore-keys: |
            ${{ runner.os }}-apt-openscad-

      - name: Install OpenSCAD
        run: |
          sudo apt-get update && sudo apt-get install -y openscad

      - name: Generate STL files
        id: generate
        run: |
          scad_files_to_build_json="[]"
          if [[ "${{ github.event.inputs.force_regenerate }}" == "true" ]]; then
            scad_files_to_build_json=$(python .github/scripts/build.py --get-all-files)
          else
            changed_files=$(python .github/scripts/build.py --get-changed-files)
            missing_files=$(python .github/scripts/build.py --get-missing-files)
            scad_files_to_build_json=$(jq -n \
            --argjson a "$changed_files" \
            --argjson b "$missing_files" \
            '$a + $b | unique')
          fi

          if [[ -z "$scad_files_to_build_json" || "$scad_files_to_build_json" == "[]" ]]; then
            echo "No SCAD files to process."
            echo "should_commit=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "should_commit=true" >> $GITHUB_OUTPUT
          scad_files_to_build=$(echo "$scad_files_to_build_json" | jq -r '.[]' | tr '\n' ' ')
          python .github/scripts/build.py --build $scad_files_to_build

      - name: Upload STL artifacts
        if: steps.generate.outputs.should_commit == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: stl-files
          path: |
            3d_models/*.stl
            3d_models/build_report.md

  commit-changes:
    runs-on: ubuntu-latest
    needs: generate-stl
    if: needs.generate-stl.outputs.should_commit == 'true' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all STL artifacts
        uses: actions/download-artifact@v8
        with:
          name: stl-files
          path: 3d_models/

      # main is a protected branch, so a direct push is rejected (GH006).
      # Open (or update) a PR with the regenerated artifacts instead.
      - name: Create pull request with regenerated STL files
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'ci: Auto-generate STL files and build report'
          author: GitHub Action STL Generator <action@github.com>
          branch: ci/auto-stl-regen
          delete-branch: true
          title: 'ci: regenerate STL files from SCAD'
          body: |
            Automated regeneration of STL files and the build report from the
            SCAD sources on `main`.

            Opened by the STL generation workflow because `main` is protected
            and cannot be pushed to directly.
          add-paths: |
            3d_models/*.stl
            3d_models/build_report.md
