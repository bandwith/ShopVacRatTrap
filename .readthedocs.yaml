---
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: '3.13'
  jobs:
    post_checkout:
      # Cancel building pull requests when there aren't any changes to the docs folder or mkdocs.yml
      - |
        if [ "$READTHEDOCS_VERSION_TYPE" = "external" ] && git diff --quiet origin/main -- docs/ mkdocs.yml uv.lock;
        then
          exit 183;
        fi
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --frozen --only-group docs

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true

formats:
  - pdf
  - epub
